# Project-wide Gradle settings.
# Gradle 8.13 supports Java 17-23 only. Java 25 is NOT supported.
# Use Android Studio's bundled JDK for Gradle (compatible; avoids "Unsupported class file major version 69").
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
# If the above path doesn't exist, install JDK 21 and set e.g.:
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx1536m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.useAndroidX=true
# Keep Jetifier for legacy dependencies; default is false (will be removed in AGP 10).
android.enableJetifier=true
android.nonTransitiveRClass=false
# Resvalues: we set true; default is false. Remove when ready for AGP 10.
android.defaults.buildfeatures.resvalues=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Suppress noisy warnings (build still succeeds):
# - Java 8 source/target with JDK 21 (bump to Java 11+ in modules to fix properly).
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# - Library constraints: suppress sync warning; or enable the feature for large projects.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

